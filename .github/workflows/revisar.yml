name: Revisar convocatorias de Policía

on:
  schedule:
    # Se ejecuta automáticamente cada 3 horas
    - cron: "0 */3 * * *"
  workflow_dispatch: # Permite lanzarlo manualmente con un clic en la pestaña Actions

permissions:
  contents: write

jobs:
  revisar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar bot de revisión
        run: python bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Guardar historial de avisos (seen.json)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || (git commit -m "Actualizar historial de avisos [skip ci]" && git push)
